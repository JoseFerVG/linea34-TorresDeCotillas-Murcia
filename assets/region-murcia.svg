<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 60" width="100%" height="100%">
  <!-- Región de Murcia Crest / Badge -->
  <g fill="#cfebe3">
    <!-- Crown -->
    <g transform="translate(18, 4) scale(0.7)">
      <path d="M4 18 L2 5 L8 10 L14 3 L20 10 L26 5 L24 18 Z" fill="none" stroke="#cfebe3" stroke-width="2" stroke-linejoin="round"/>
      <line x1="2" y1="21" x2="26" y2="21" stroke="#cfebe3" stroke-width="2"/>
    </g>

    <!-- Shield outline -->
    <path d="M 22 22 L 42 22 C 42 34 32 42 32 44 C 32 42 22 34 22 22 Z" fill="none" stroke="#cfebe3" stroke-width="1.8"/>

    <!-- 7 Castles (Left quadrant) & 4 Crowns (Right quadrant) dots/lines -->
    <circle cx="27" cy="27" r="1" fill="#cfebe3"/>
    <circle cx="30" cy="27" r="1" fill="#cfebe3"/>
    <circle cx="27" cy="31" r="1" fill="#cfebe3"/>
    <circle cx="30" cy="31" r="1" fill="#cfebe3"/>
    <circle cx="28.5" cy="35" r="1" fill="#cfebe3"/>

    <circle cx="35" cy="27" r="1.2" fill="#cfebe3"/>
    <circle cx="38" cy="27" r="1.2" fill="#cfebe3"/>
    <circle cx="35" cy="32" r="1.2" fill="#cfebe3"/>
    <circle cx="38" cy="32" r="1.2" fill="#cfebe3"/>

    <!-- Text: Región de Murcia -->
    <text x="50" y="28" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="11" font-weight="600" fill="#cfebe3">Región</text>
    <text x="96" y="28" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="11" font-weight="600" fill="#cfebe3">de Murcia</text>
  </g>
</svg>
